# Build the image as shipped, boot it, and say what changed in it.
name: iso

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "references/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "references/**"]
  # Debian, Flathub and the actions move under us; find out weekly.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read # to fetch main's last package list

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and boot
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      - name: Build the ISO
        run: make iso

      - name: Prepare KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-system-gui python3-pil

      - name: Boot it
        run: make smoke

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: boot
          path: |
            .out/iso/*.png
            .out/iso/serial.log
          include-hidden-files: true
          retention-days: 14

      - name: Report package changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/package-diff.sh live-build/callisto-amd64.packages >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: live-build/callisto-amd64.packages
          retention-days: 90

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: callisto-iso
          path: |
            callisto-amd64.hybrid.iso
            SHA256SUMS
          compression-level: 0
          retention-days: 7
