# Fuzzel launcher styled to the Triton Thick Glass material.
# Every color derives from design/tokens.json — edit tokens, not values.
# Format: fuzzel colors are AARRGGBB hex.

[main]
font=Jost:size=13
prompt="Search apps  "
lines=8
width=42
horizontal-pad=24
vertical-pad=16
inner-pad=10
layer=overlay

# radius-xl: the launcher is a floating surface, so it owns the big radius.
border-radius=28
border-width=1

[colors]
# Thick Glass: surface_container_high #282A2F at 0.88 alpha
background=282a2fe0
text=e2e2e9ff
match=b0c6ffff
selection=00429bff
selection-text=d9e2ffff
selection-match=ffb59bff
border=8e909966

[border]
width=1
radius=28
