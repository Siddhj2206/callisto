# GTK settings — Callisto defaults. The whole desktop is dark-first per the
# Triton design tokens; the Settings app's appearance panel flips this when
# the user picks light mode (written by the theme engine, never by hand).

[Settings]
gtk-application-prefer-dark-theme=true
gtk-theme-name=Adwaita
gtk-font-name=Google Sans Flex 11
gtk-cursor-theme-name=Adwaita
