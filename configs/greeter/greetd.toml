# greetd configuration for Callisto.
#
# The live image also has an [initial_session], which logs straight in once per
# boot; the installer removes it. [default_session] is the Callisto greeter,
# with tuigreet behind it, so the machine never drops to a bare TTY.

[terminal]
vt = 1

[initial_session]
command = "/usr/local/bin/start-callisto"
user = "user"

[default_session]
command = "/usr/local/bin/callisto-greeter"
user = "greeter"
