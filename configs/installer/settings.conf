# The Callisto installer. See configs/installer/README.md.
---
modules-search: [ local ]

instances:
  - id: prepare
    module: shellprocess
    config: shellprocess-prepare.conf
  - id: bootloader
    module: shellprocess
    config: shellprocess-bootloader.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - locale
      - keyboard
      - localecfg
      # Before fstab, which names the key file in crypttab only if it exists.
      - luksbootkeyfile
      - fstab
      # Removes the live user before the real one is made.
      - shellprocess@prepare
      - users
      - networkcfg
      - hwclock
      - shellprocess@bootloader
      - packages
      - initramfscfg
      - initramfs
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished

branding: callisto
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
