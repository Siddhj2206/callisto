---
# The account always asks for its password: automatic login would leave the
# keyring locked, and is for the live session only.
doAutologin: false
sudoersGroup: sudo
sudoersConfigureWithGroup: false
setRootPassword: false
doReusePassword: false
defaultGroups:
  - sudo
  - audio
  - video
  - input
  - render
  - netdev
  - plugdev
  - cdrom
  - users
user:
  shell: /bin/bash
passwordRequirements:
  nonempty: true
  libpwquality:
    - minlen=8
allowWeakPasswords: true
allowWeakPasswordsDefault: false
