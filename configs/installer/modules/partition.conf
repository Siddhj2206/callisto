---
efi:
  mountPoint: /boot/efi
  recommendedSize: 512MiB
  minimumSize: 100MiB
  label: EFI
# Compressed swap in memory is set up by zram; a swap file adds hibernation room.
userSwapChoices: [ none, file ]
initialSwapChoice: none
initialPartitioningChoice: none
defaultFileSystemType: ext4
availableFileSystemTypes: [ ext4, btrfs ]
# GRUB reads LUKS1 reliably.
luksGeneration: luks1
