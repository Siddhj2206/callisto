# Callisto Hyprland configuration — the system-default session config.
#
# Triton layout principles:
#   1. Tiled windows: zero gaps, zero rounding. Radius and blur belong only
#      to floating surfaces and shell panels.
#   2. Glass materials get their blur from the compositor here — the shell
#      itself only ships translucent fills.
#   3. Nothing here is user-serviceable: the Settings app owns every knob a
#      user should ever turn, writing through the settings store. If you find
#      yourself editing this file by hand, that's a missing settings panel.
#
# User overrides land in ~/.config/hypr/callisto-user.conf (written by the
# Settings app, sourced below) — never by editing this file.

monitor = , preferred, auto, 1

# --- Session autostart -----------------------------------------------------------
# The shell IS the wallpaper renderer (Desktop.qml layer surface) — no swaybg
# or hyprpaper. The polkit agent is a systemd user unit (hyprpolkitagent,
# enabled globally in the image) and needs no exec-once either.
exec-once = uwsm app -- qs -c triton

# --- Input ------------------------------------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
        disable_while_typing = true
    }

    sensitivity = 0
    accel_profile = flat
}

# --- Layout: Triton principle 1 -----------------------------------------------------
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 1
    col.active_border = rgba(b0c6ff66)
    col.inactive_border = rgba(44474f44)
    layout = dwindle
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# --- Decoration ----------------------------------------------------------------------
decoration {
    rounding = 0

    blur {
        enabled = true
        size = 8
        passes = 3
        noise = 0.0117
        xray = false
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(00000055)
    }

    dim_inactive = false
}

# --- Animation ----------------------------------------------------------------------
# Triton motion: fast, spring-like, never bouncy on layout. The shell's own
# surface motion lives in QML; this governs windows only.
animations {
    enabled = true

    bezier = tritonIn, 0.2, 0.9, 0.25, 1.0
    bezier = tritonOut, 0.16, 1.0, 0.3, 1.0

    animation = windows, 1, 4, tritonOut, slide
    animation = windowsIn, 1, 4, tritonOut
    animation = windowsOut, 1, 3, tritonIn
    animation = border, 0
    animation = fade, 1, 3, tritonIn
    animation = workspaces, 1, 4, tritonOut, slide
}

# --- Gestures ---------------------------------------------------------------------------
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 250
}

# --- Floating surfaces get the Triton radius ----------------------------------------------
windowrulev2 = rounding 28, floating:1

# Shell dialogs and settings windows float by design.
windowrulev2 = float on, match:class ^(callisto-settings)$
windowrulev2 = rounding 28, match:class ^(callisto-settings)$

# --- Layer rules: shell materials -----------------------------------------------------------
# Quickshell layer surfaces get compositor blur for Glass and Thick Glass.
# ignore_alpha keeps fully-transparent regions (everything outside the
# bar islands) from catching the effect.
layerrule = blur on, match:namespace quickshell
layerrule = ignore_alpha 0.05, match:namespace quickshell
layerrule = no_anim on, match:namespace ^(quickshell)$

# --- Keybinds --------------------------------------------------------------------------------
# Shell surfaces are driven through quickshell IPC — the shell is the single
# source of truth for its own visibility. Nothing here shells out to ad-hoc
# UI binaries; if a surface exists, it answers IPC.

$mod = SUPER

# Triton surfaces
bind = $mod, Space, exec, uwsm app -- qs -c triton ipc call launcher toggle
bind = $mod, Q, killactive
bind = $mod SHIFT, E, exec, uwsm app -- qs -c triton ipc call power toggle
bind = $mod, Tab, exec, uwsm app -- qs -c triton ipc call overview toggle
bind = $mod, V, exec, uwsm app -- qs -c triton ipc call clipboard toggle
bind = $mod, N, exec, uwsm app -- qs -c triton ipc call notifications toggle
bind = $mod, I, exec, uwsm app -- qs -c triton ipc call quicksettings toggle
bind = $mod, comma, exec, uwsm app -- qs -c triton ipc call settings toggle
bind = $mod SHIFT, W, exec, uwsm app -- qs -c triton ipc call wallpaper toggle

# Apps
bind = $mod, Return, exec, uwsm app -- foot

# Window management
bind = $mod, F, togglefloating
bind = $mod, M, fullscreen

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# Resize with mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Media keys — the shell's OSD observes these changes.
bindel = , XF86AudioRaiseVolume, exec, uwsm app -- wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, uwsm app -- wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, uwsm app -- wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, uwsm app -- wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, uwsm app -- brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, uwsm app -- brightnessctl set 5%-
bindl = , XF86AudioPlay, exec, uwsm app -- playerctl play-pause
bindl = , XF86AudioNext, exec, uwsm app -- playerctl next
bindl = , XF86AudioPrev, exec, uwsm app -- playerctl previous

# Lock — hyprlock is the session-lock provider (ext-session-lock). The Triton
# lock surface replaces this when its own session-lock integration lands.
bind = $mod, Escape, exec, uwsm app -- hyprlock

xwayland {
    # XWayland apps use wayland-side scaling instead of X11-side — the
    # classic blurry/oversized xwayland app fix.
    force_zero_scaling = true
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = false
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    vrr = 1
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

# Settings-app-managed user overrides. Everything in here was written by the
# settings store — editing by hand is unsupported but harmless.
source = ~/.config/hypr/callisto-user.conf
