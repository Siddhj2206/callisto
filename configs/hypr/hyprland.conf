# Callisto Hyprland configuration.
#
# Implements the Triton layout principles:
#   1. Tiled windows: zero gaps, zero rounding. Radius and blur belong only
#      to floating surfaces and shell panels.
#   2. Glass materials get their blur from the compositor here — the shell
#      itself only ships translucent fills.
#
# Session services are started through uwsm/systemd where possible; compositor
# exec-once is reserved for things tightly coupled to the compositor lifetime.

monitor = , preferred, auto, 1

# --- Autostart -------------------------------------------------------------------
exec-once = swaybg -i /usr/share/backgrounds/callisto/wallpaper.jpg -m fill
exec-once = qs -c triton

# --- Input ------------------------------------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# --- Layout: Triton principle 1 -----------------------------------------------------
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 1
    col.active_border = rgba(b0c6ff66)
    col.inactive_border = rgba(44474f44)
    layout = dwindle
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# --- Decoration ----------------------------------------------------------------------
decoration {
    # Tiled windows are square; floating rounding comes from windowrule below.
    rounding = 0

    blur {
        enabled = true
        size = 8
        passes = 3
        xray = false
    }

    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(00000055)
    }
}

animations {
    enabled = true
}

# --- Floating surfaces get the Triton radius ------------------------------------------
windowrulev2 = rounding 28, floating:1

# --- Layer rules: shell materials -------------------------------------------------------
# Hyprland 0.55 match syntax. quickshell surfaces get blur for the Glass and
# Thick Glass materials; ignore_alpha keeps fully-transparent regions of the
# bar window (everything outside the islands) from catching the effect.
layerrule = blur on, match:namespace quickshell
layerrule = ignore_alpha 0.5, match:namespace quickshell
layerrule = blur on, match:namespace launcher

# --- Keybinds -----------------------------------------------------------------------------
$mod = SUPER

bind = $mod, Space, exec, pkill fuzzel || fuzzel
bind = $mod, Return, exec, foot
bind = $mod, Q, killactive
bind = $mod, F, togglefloating
bind = $mod, M, fullscreen

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# Focus movement (vim keys)
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# Volume/brightness keys — the shell's OSD observes these changes.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = false
}
