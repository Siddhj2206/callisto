# Hyprland configuration for the nested shell test harness.
# Minimal on purpose — this environment exists to exercise the shell,
# not to replicate the full ISO desktop (that is configs/hypr/hyprland.conf).

monitor = , preferred, auto, 1

input {
    kb_layout = us
}

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 1
}

decoration {
    blur {
        enabled = true
        size = 8
        passes = 3
    }
}

animations {
    enabled = true
}

# Layer rules use Hyprland 0.55 match syntax.
layerrule = blur on, match:namespace quickshell
layerrule = ignore_alpha 0.5, match:namespace quickshell

misc {
    # Nested instances show a Hyprland logo backdrop otherwise; quieter for tests.
    disable_hyprland_logo = true
    force_default_wallpaper = false
}

# Test conveniences inside the nested session.
bind = SUPER, Return, exec, foot
bind = SUPER, Space, exec, pkill fuzzel || fuzzel
bind = SUPER, Q, killactive
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5

debug {
    disable_logs = false
}
