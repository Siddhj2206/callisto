# foot terminal — Callisto system defaults.
# The Settings app rewrites this through the theme engine; do not hand-edit
# in production. Colors come from the Triton palette so the terminal reads
# as part of the shell, not a foreign object.

[main]
font=JetBrains Mono:size=12
pad=16x16
include=/usr/share/callisto/foot-theme.ini

[cursor]
style=beam
blink=yes

[scrollback]
lines=10000

[mouse]
hide-when-typing=yes
